# =============================================================================
# Ghostty 終端機最終設定檔 - 專為 Victor Mono & OpenCode 優化 (無縫吃滿四邊版)
# =============================================================================

# --- 1. 字型家族與樣式設定 ---
font-family = "VictorMono Nerd Font Mono"
font-size = 13.5

font-style-italic = "Oblique"
font-style-bold-italic = "Bold Oblique"


# --- 2. 閱讀舒適度與字元間距調校 ---
adjust-cell-width = 2%
adjust-cell-height = 12%


# --- 3. 視窗排版與無縫貼邊優化 (解決 tmux / OpenCode 填不滿四邊的空隙問題) ---
# 關鍵：將主動內縮留白降為 0，強迫字元與視窗最邊緣完美無縫貼合
window-padding-x = 0
window-padding-y = 0

# 關鍵：當字元格數不整除視窗尺寸時，強制將邊緣背景色無條件延伸填滿，杜絕任何碎屑白邊或空隙
window-padding-color = extend-always


# --- 4. 語法高亮與終端機色彩集體優化 (全新 Tokyo Night 高彩度調色盤) ---
# 基礎黑與灰（用於背景與暗色文字）
palette = 0=#15161e
palette = 8=#414868

# 【鮮豔錯誤紅】採用高彩度霓虹櫻桃紅，在純黑底色下極度鮮明
palette = 1=#ff4f5e
palette = 9=#ff6c7b

# 【調校：更翠綠的松石綠】降低藍色調，注入高亮寶石翠綠（Emerald Mint），鮮顯又充滿生機
palette = 2=#00c896
palette = 10=#00f0b4

# 黃色與亮黃（點亮你的使用者名稱與警告提示）
palette = 3=#e0af68
palette = 11=#e0af68

# 藍色與亮藍（點亮原本死暗的路徑與目錄名稱，變成明亮的極光藍）
palette = 4=#7aa2f7
palette = 12=#7aa2f7

# 紫色與亮紫（讓終端機其他特殊符號帶有精緻的薰衣草紫）
palette = 5=#bb9af7
palette = 13=#bb9af7

# 青色與亮青（提供完美的輔助冰藍色）
palette = 6=#7dcfff
palette = 14=#7dcfff

# 白色與亮白（讓普通的清單與文字輸出變得清晰白皙，不偏灰）
# 2026-07-28: 調暗前景色以降低與深色背景的對比度（減少閱讀刺眼感）
palette = 7=#565f89
palette = 15=#9699a8


# --- 5. OpenCode ＆ 資料庫 TUI 專屬優化 ---
# 優化非等寬 Nerd Font 圖標與文字對齊
font-thicken = true

# 完美的滑鼠滾輪速度，在飛速滾動看 Claude 產出的程式碼或長日誌時防止畫面撕裂
mouse-scroll-multiplier = 1.0


# =============================================================================
# 鍵位分工（2026-10-27：Ctrl+Tab 釋放回 Ghostty）
#
#   Ctrl+Tab / Ctrl+Shift+Tab  → Ghostty 自己的 tab（用內建預設，本檔不再覆寫）
#   Ctrl+Shift+← / →           → Ghostty 自己的 tab（明確寫出，不依賴內建預設）
#   Alt+↑ / Alt+↓              → OpenCode session tab（previous / next；opencode 內建預設）
#   Alt+← / Alt+→              → OpenCode session tab（同上；repo cli.json 追加）
#                                🟠 代價：這兩個鍵原本是輸入框的「按詞移動」，現改由
#                                   Ctrl+← / Ctrl+→ 或 Alt+B / Alt+F 擔當（兩者都還在）
#   Ctrl+Shift+`               → OpenCode：重啟 service（反引號的 ctrl 位元組是 `0x00`，故由終端
#                                改送 `0x1c` —— 與實體 ctrl+\ 完全相同的位元組，opencode 已綁該鍵）
#   Ctrl+Shift+L               → OpenCode：開新 session + 自動重載 context（plugin `reset-session`
#                                的 keybind；prompt 來源是 `commands/load-context.md`）
#   （tab 的關閉／還原不經 Ghostty：ctrl+c＝有字清字／空則關 tab、ctrl+y＝restore）
#
# ❗ 改本檔後，執行中的 Ghostty **不會**自動重載 → 必須按 ctrl+shift+,（reload_config），
#    否則新 keybind 不生效，症狀與「方案不可行」一模一樣（ghostty +list-keybinds 讀的是檔案，
#    只證明語法合法，不代表執行中的 instance 已更新）。
#
# 為何不再改寫 Ctrl+Tab：那會吃掉 Ghostty 自己的 next_tab；而 Alt+方向鍵是 opencode 內建預設，
# 不需要終端層介入。Ctrl+Shift+← / → 經 2026-10-12 實測可區分，故仍由 Ghostty 使用。
# =============================================================================
keybind = ctrl+shift+arrow_right=next_tab
keybind = ctrl+shift+arrow_left=previous_tab

# Ctrl+Shift+`：**不能**直接送給 opencode —— 反引號的 ctrl 位元組是 `0x00`（與 ctrl+space 同值），
# tmux 的 VT10x pane 收不到 shift 資訊 → 一律被命名為 `ctrl+space`（Crostini 又被 host IME 吃掉）。
# 解法：在終端層改送**與 ctrl+\ 相同的位元組**（`0x1c`）—— opencode 已綁那顆鍵（`service.restart`），
# 不必再猜它內部叫 `ctrl+backslash` 還是 `ctrl+\`。`text:` 用 Zig string literal 語法。
# 🟠 其他 pane（shell）收到 `0x1c` 是 SIGQUIT，與實體 ctrl+\ 同風險。
keybind = ctrl+shift+backquote=text:\x1c

# Ctrl+Shift+L：在 legacy 編碼下它與 Ctrl+L 是同一個位元組（0x0c），所以會撞上內建的
# 「開新 session」，永遠輪不到 reset-session。這裡讓 Ghostty 直接送出 kitty 協議的
# CSI-u 編碼（ESC[108;6u = ctrl+shift+l），opencode 認得它 —— 2026-10-12 以注入實測通過。
keybind = ctrl+shift+l=csi:108;6u
