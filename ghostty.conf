# =============================================================================
# Ghostty 終端機最終設定檔 - 專為 Victor Mono & OpenCode 優化 (無縫吃滿四邊版)
# =============================================================================

# --- 1. 字型家族與樣式設定 ---
font-family = "VictorMono Nerd Font Mono"
font-size = 13.5

font-style-italic = "Oblique"
font-style-bold-italic = "Bold Oblique"


# --- 2. 閱讀舒適度與字元間距調校 ---
adjust-cell-width = 2%
adjust-cell-height = 12%


# --- 3. 視窗排版與無縫貼邊優化 (解決 tmux / OpenCode 填不滿四邊的空隙問題) ---
# 關鍵：將主動內縮留白降為 0，強迫字元與視窗最邊緣完美無縫貼合
window-padding-x = 0
window-padding-y = 0

# 關鍵：當字元格數不整除視窗尺寸時，強制將邊緣背景色無條件延伸填滿，杜絕任何碎屑白邊或空隙
window-padding-color = extend-always


# --- 4. 語法高亮與終端機色彩集體優化 (全新 Tokyo Night 高彩度調色盤) ---
# 基礎黑與灰（用於背景與暗色文字）
palette = 0=#15161e
palette = 8=#414868

# 【鮮豔錯誤紅】採用高彩度霓虹櫻桃紅，在純黑底色下極度鮮明
palette = 1=#ff4f5e
palette = 9=#ff6c7b

# 【調校：更翠綠的松石綠】降低藍色調，注入高亮寶石翠綠（Emerald Mint），鮮顯又充滿生機
palette = 2=#00c896
palette = 10=#00f0b4

# 黃色與亮黃（點亮你的使用者名稱與警告提示）
palette = 3=#e0af68
palette = 11=#e0af68

# 藍色與亮藍（點亮原本死暗的路徑與目錄名稱，變成明亮的極光藍）
palette = 4=#7aa2f7
palette = 12=#7aa2f7

# 紫色與亮紫（讓終端機其他特殊符號帶有精緻的薰衣草紫）
palette = 5=#bb9af7
palette = 13=#bb9af7

# 青色與亮青（提供完美的輔助冰藍色）
palette = 6=#7dcfff
palette = 14=#7dcfff

# 白色與亮白（讓普通的清單與文字輸出變得清晰白皙，不偏灰）
# 2026-07-28: 調暗前景色以降低與深色背景的對比度（減少閱讀刺眼感）
palette = 7=#565f89
palette = 15=#9699a8


# --- 5. OpenCode ＆ 資料庫 TUI 專屬優化 ---
# 優化非等寬 Nerd Font 圖標與文字對齊
font-thicken = true

# 完美的滑鼠滾輪速度，在飛速滾動看 Claude 產出的程式碼或長日誌時防止畫面撕裂
mouse-scroll-multiplier = 1.0


# =============================================================================
# 鍵位分工（2026-10-12 交換：opencode 用 Ctrl+Tab，Ghostty 自己用 Ctrl+Shift+←/→）
#
#   Ctrl+Tab / Ctrl+Shift+Tab  → OpenCode session tab（送給 tmux 內的程式）
#   Ctrl+Shift+L               → OpenCode：開新 session + 自動重載 context（reset-session plugin）
#   Ctrl+Shift+R               → OpenCode：restore 上一個關掉的 session tab（2026-10-16 加入）
#   Ctrl+Shift+← / →           → Ghostty 自己的 tab（明確寫出，不依賴內建預設）
#
# ❗ 改本檔後，執行中的 Ghostty **不會**自動重載 → 必須按 ctrl+shift+,（reload_config），
#    否則新 keybind 不生效，症狀與「方案不可行」一模一樣（ghostty +list-keybinds 讀的是
#    檔案，只證明語法合法，不代表執行中的 instance 已更新）。
#
# 作法：把 Ctrl+Tab 改送 Alt+Down / Alt+Up 的標準序列（CSI 1;3B / CSI 1;3A），
#       tmux 沒有這些鍵的 root 綁定 → 原樣轉給 pane，而 OpenCode 的
#       session.tab.next / session.tab.previous 預設就含 alt+down / alt+up
#       （已實測 alt+down / alt+up 可直接切 session tab）。
# Ghostty 另有 ctrl+page_up / ctrl+page_down、alt+1..9 可切自己的 tab。
# 還原：刪掉本區塊，或 cp /tmp/opencode/config.ghostty.orig 覆蓋回去。
# =============================================================================
keybind = ctrl+tab=csi:1;3B
keybind = ctrl+shift+tab=csi:1;3A
keybind = ctrl+shift+arrow_right=next_tab
keybind = ctrl+shift+arrow_left=previous_tab

# Ctrl+Shift+L：在 legacy 編碼下它與 Ctrl+L 是同一個位元組（0x0c），所以會撞上內建的
# 「開新 session」，永遠輪不到 reset-session。這裡讓 Ghostty 直接送出 kitty 協議的
# CSI-u 編碼（ESC[108;6u = ctrl+shift+l），opencode 認得它 —— 2026-10-12 以注入實測通過。
keybind = ctrl+shift+l=csi:108;6u

# Ctrl+Shift+R：OpenCode restore 上一個關掉的 session tab（session.tab.reopen）
# 同 Ctrl+Shift+L 的兩層作法：legacy 下 Ctrl+Shift+R 與 Ctrl+R 是同一位元組（0x12），
# opencode 會當成「Rename session」→ 這裡直接送 kitty 協議 CSI-u（ESC[114;6u = ctrl+shift+r），
# 再由 tmux root binding（C-S-r）把同一位元組灌進 opencode pane。
keybind = ctrl+shift+r=csi:114;6u
