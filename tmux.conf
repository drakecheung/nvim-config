set -g default-shell /usr/bin/zsh
set -g history-limit 10000                    # scrollback buffer n lines
set -g base-index 0                           # start window indexing at zero (default)
set -g default-terminal 'screen-256color'     # tell tmux to use 256 colour terminal
setw -g xterm-keys on                         # xterm-style function key sequences
setw -g automatic-rename off                  # control automatic window renaming
set -g display-panes-color colour238          # style the switch pane ui
set -g display-panes-active-colour colour118
set -g display-panes-time 700
set -g status-keys vi                         # vi-style controls for copy mode
set -g mode-keys vi
set -g set-clipboard off
# terminal-features 是 server 選項，而 `set -as` 每重載一次就 append 一次 → 會累積重複項；
# 故先用 -u 還原 tmux 內建預設，再 append 一次，讓每次 source 都收斂到同一組。
set -su terminal-features
set -as terminal-features ',xterm-ghostty:hyperlinks'   # forward OSC 8 hyperlinks to outer terminal (ghostty)
# allow-passthrough OFF: turning it on lets opencode query the outer terminal directly
# (opencode↔ghostty DECRQM) and tmux leaks the replies as visible garbage. OSC8 link
# clicks still work via the `hyperlinks` terminal-feature above. Set it explicitly —
# `source-file` never unsets an already-set value, so the built-in default is not a
# safety net once anything sets it to on.
set -g allow-passthrough off

# tmux 3.8 新增 theme 選項（detect/terminal/light/dark）。預設 detect 會依終端自動挑 light 或
# dark，使未被顯式指定的顏色（popup / menu / display-panes 邊框…）改用主題色名；在此深色
# 終端上被判為 light 而顯得偏白。強制 dark，並把灰階對齊本 config 的調色盤。
set -s theme dark
set -s dark-theme-black      colour232
set -s dark-theme-dark-grey  colour238    # popup / menu / panes-mode 邊框底色（比底色 232 亮 6 階）
set -s dark-theme-light-grey colour250    # popup 邊框線
set -s dark-theme-white      colour255    # popup 文字

set -g mouse on                               # enable mouse selection in copy mode
set -g display-time 2000                      # amount of time (ms), how long the status line messages and other indicators are displayed
set -s escape-time 0                          # faster escape
set -g status-interval 500
set -g status-justify centre                  # center the status bar (windows list)
set -g status-position top
set -g visual-activity off                    # keep silent
set -g visual-bell off
set -g visual-silence off
set -g focus-events on                           # send focus events to apps (nvim autoread)
setw -g monitor-activity off

# statusbar / title colors and format
set -g status-style fg=white,bg=colour234
set -g window-status-style fg=colour249,bg=default
setw -g window-status-current-style bg=colour240,fg=colour255,bold
setw -g window-status-current-format "  #{?#{@agent_perm},#[fg=colour208]● #[default],#{?#{@agent_done},#[fg=colour114]● #[default],}}#W  "
setw -g window-status-format         "  #{?#{@agent_perm},#[fg=colour208]● #[default],#{?#{@agent_done},#[fg=colour114]● #[default],}}#W  "
# orange dot = agent needs you (permission/feedback); green dot = turn done.
# markers are set by the opencode tmux-bell plugin, cleared as soon as you
# select that window (per-window user options, cleared by the hook below).
set-hook -g after-select-window 'run-shell "tmux set-option -uw -t #{window_id} @agent_done; tmux set-option -uw -t #{window_id} @agent_perm"'
# rhs of status bar, top-left corner
set -g status-left-length 10
set -g status-left '#S:#I-#P'
set -g status-right ''
# style inactive panes
set -g window-style fg=colour254,bg=color232
set -g window-active-style fg=colour254,bg=colour232
# style borders
set -g pane-border-lines single
set -g pane-border-status off # bottom
set -g pane-border-format "#[fg=colour245]#{?pane_active,#[fg=white],} #P "
set -g pane-border-style bg=colour232,fg=colour244         # inactive
set -g pane-active-border-style bg=colour232,fg=colour255  # active
# 3.8 的 panes-mode（display-panes）邊框預設會吃主題色名，顯式對齊一般邊框以免閃示時出現異色
set -g display-panes-border-style 'bg=colour232,fg=colour244'
# popup（Ctrl+S 的 fzf 專案選單）：圓角外框由 fzf 自己畫（選項在 bin/open-project），
# 故 tmux 這邊不畫框，避免雙框；底色 238 與 fzf 的 bg:238 一致。
set -g popup-border-lines none
set -g popup-style 'bg=#114b52,fg=themewhite'
# command/message line colors
set -g message-style fg=white,bg=black,bright


bind-key C-b send-prefix                      # send the prefix to client inside window (nested tmux)

# reload settings with <c-b> R
bind-key R source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"

bind-key "'" choose-window
bind-key '"' choose-session
bind-key -r h swap-window -dt -1                      # c-b h/l to move window
bind-key -r l swap-window -dt +1
bind-key -r J swap-pane -D                            # c-b J/K to move pane
bind-key -r K swap-pane -U
bind-key p choose-buffer                              # select and paste previously copied text from copy-mode
bind-key Space command-prompt "rename-window %%"      # title (default key in tmux is ',')
unbind-key -n C-t                                     # disabled for nvim-tree

# nvim-config 的 bin 目錄：由 ~/.tmux.conf 的 symlink 推算，不寫死任何主機佈局（主機是 $HOME/drake/…）。
# tmux 不支援 config 內的 $(...) 展開，故用一次 run-shell 算出後存進 @nvc_bin，其餘地方以 #{@nvc_bin} 引用。
# 若 ~/.tmux.conf 不是 symlink（有人手動複製），推算結果會落在 $HOME；因此以 `bin/toggle-opencode` 為標記，
# 找不到就依序試既有的三種佈局，避免靜默綁到不存在的路徑。
run-shell 'd="$(cd "$(dirname "$(readlink -f "$HOME/.tmux.conf")")" && pwd)"; for c in "$d" "$HOME/drake/nvim-config" "$HOME/drakecheung/nvim-config" "$HOME/nvim-config"; do if [ -x "$c/bin/toggle-opencode" ]; then tmux set -g @nvc_bin "$c/bin"; break; fi; done'

# copying and pasting (vim-like)
# m-] to enter copy mode, v to start selection
# esc / c-c to cancel selection (stay in / leave the copy mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi s send-keys y\; run "#{@nvc_bin}/paste-to-prev-vi"

bind C-k send-keys -R \; clear-history                # ctrl-k to clear scrollback buffer

set -g @plugin 'tmux-plugins/tpm'
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# prefix + I inside TMUX to download plugins

set -g @plugin 'tmux-plugins/tmux-copycat'
# prefix + c-f       search filename
# prefix + c-u       url search (http, ftp and git urls)
# prefix + m-i       search IP

set -g @plugin 'tmux-plugins/tmux-yank'
# in copy mode, y to copy to clipboard, Y to paste directly without going clipboard

set -g @plugin 'tmux-plugins/tmux-open'

run '~/.tmux/plugins/tpm/tpm'

run 'tmux setenv PATH $PATH:`readlink ~/.tmux.conf | sed -e "s|tmux.conf|bin|"`'
run "rm -f ~/.open-project.cache"

# c-s — browse ALL git repos (🏠 registered / 📦 clean)
bind-key -n C-s run "open-project"

# Ctrl+Alt+S to refresh project list (after adding new project.vim.lua)
bind-key -n C-M-s run "refresh-projects"

# check if any projects has changes
bind-key C-b popup -E -T " [ git-status-all ] " -w 80 -h 80% "zsh -c 'git-status-all | less -R'"
bind-key p popup -E -T " [ git-pull-all : Scan > Pull All Projects ] " -w 120 -h 90% "zsh -c 'git-pull-all'"

# Alt shift h/l cycles thru tabs (no prefix)
bind-key -n "M-S-H" select-window -t :- # tmux 1.9
bind-key -n "M-S-L" select-window -t :+
bind-key -n "M-H" select-window -t :- # tmux 2.1
bind-key -n "M-L" select-window -t :+

# Alt j/k cycles thru panes (no prefix)
unbind-key -n "M-k"
unbind-key -n "M-j"
# 3.8 把 display-panes 由 overlay 改成 per-pane mode（cmd-display-panes.c 已刪除）。不給 -Z
# 時 tmux 先放大 window，mode 畫布隨之 resize 成整個 window，於是 1:1 重畫全部 pane + 編號
# （等同舊 overlay 觀感）；代價是目標 pane 被 resize 兩次（實測 pty 收到 WINCH 50→100→50），
# 其中的全螢幕 TUI（如 opencode）會重排一次。給 -Z 則不放大、不 resize，但畫布只剩單一 pane
# 大小 → 整個 window 被縮圖塞進去。另依 upstream issue #5715，先退出殘留的 panes-mode，
# 避免多個 mode 疊在同一個 window。
bind-key -n "M-J" if-shell -F '#{==:#{pane_mode},panes-mode}' 'send q' \; select-pane -t :.- \; display-panes
bind-key -n "M-K" if-shell -F '#{==:#{pane_mode},panes-mode}' 'send q' \; select-pane -t :.+ \; display-panes
bind-key -n "M-]" copy-mode

# Split windows alt +   { -  or  | }
bind-key -n "M-t" new-window -c '#{pane_current_path}'
bind-key -n "M--" split-window -v -c '#{pane_current_path}'
bind-key -n "M-_" split-window -v -b -c '#{pane_current_path}'
bind-key -n "M-\\" split-window -h -c '#{pane_current_path}'
bind-key -n "M-|" split-window -h -b -c '#{pane_current_path}'
bind-key -n "M-u" splitw -bv 'bash -ic "nvim"'     # open vim upwards
bind-key -n "M-U" splitw -v 'bash -ic "nvim"'     # open vim upwards

# to update the alias file, use update-vim-tarball
bind-key -n "M-o" run 'tmux send-keys " eval \"\$(curl -s https://f.lokikl.com/aliases)\"" Enter'

bind-key -n C-o run-shell "#{@nvc_bin}/toggle-opencode '#{window_id}'"
bind-key -n C-n run-shell "#{@nvc_bin}/toggle-nvim '#{window_id}'"
unbind-key -n "C-;"
unbind-key -n C-\\
bind-key -n C-/ run-shell "#{@nvc_bin}/toggle-db '#{window_id}'"
bind-key -n C-a run-shell "#{@nvc_bin}/toggle-applogs '#{window_id}'"
bind-key -n M-g run-shell "#{@nvc_bin}/toggle-focus '#{window_id}'"
bind-key -n C-_ run-shell "#{@nvc_bin}/toggle-db '#{window_id}'"

# Ctrl+Shift+L → opencode：開新 session + 重載 context（plugin `reset-session` 的 keybind；
# prompt 來源是 `commands/load-context.md`）
# 為什麼需要這一層：Ghostty 端的 keybind 送出 ESC[108;6u，tmux 也確實解得成 C-S-L，
# 惟 tmux 送進 pane 時會把 shift 降級掉（pane 為 VT10x、未開擴展鍵）→ opencode 只收到
# legacy 0c（= Ctrl+L → 內建「開新 session」）。因此在 tmux 這層攔下來，把同一個
# ESC[108;6u 位元組直接灌進 opencode pane（實測可完整觸發 reset-session）。
# 非 opencode pane 原樣轉送 0c，維持 Ctrl+Shift+L ≒ Ctrl+L 的舊行為，不搶鍵。
# ❗ 條件用標記 `left-opencode`（勿用 `*opencode*` —— 會誤命中啟動指令含
#    `…/opencode-config` 的 nvim pane，理由與上面 C-S-c 同）
bind-key -n C-S-l if-shell -F '#{||:#{==:#{pane_current_command},opencode},#{m:*left-opencode*,#{pane_start_command}}}' 'send-keys -H 1b 5b 31 30 38 3b 36 75' 'send-keys -H 0c'

# ctrl+alt+l → 同一個 reset-session（終端送不出 shift 時的替代入口）
# 為什麼需要：沒有 kitty 協議的終端（例 Crostini/vshd）送不出「有 shift」的字母，
# ctrl+shift+l 與 ctrl+l 同為 0x0c；ctrl+alt+l 是 ESC + 0x0c，可分辨。
# tmux 這層把它換回 opencode 認得的 ESC[108;6u（與上面 C-S-l 灌入同一串位元組）。
bind-key -n M-C-l if-shell -F '#{||:#{==:#{pane_current_command},opencode},#{m:*left-opencode*,#{pane_start_command}}}' 'send-keys -H 1b 5b 31 30 38 3b 36 75' 'send-keys -H 1b 0c'

# 主機專屬覆寫（可選）：檔案不存在就什麼都不做，所以新機不帶此檔也能運作。
# ❗ 必須是最後一行 —— run-shell 在 config 解析後才執行，overlay 才能覆寫上面的值。
# ❗ tmux 的 source-file **不展開 `~` 也不展開 `$HOME`**（3.8 實測：直接寫
#    `source-file -q ~/…` 回 0、零錯誤、但什麼都沒載入），故包一層 run-shell 讓 shell 展開。
# ❗ source-file 只加不減：overlay 能覆寫同鍵，但無法移除本檔已綁的鍵（要移除得顯式 unbind-key）。
run-shell 'tmux source-file -q "$HOME/.tmux.local.conf"'
