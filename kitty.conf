# 保留中：目前使用 ghostty（見 ghostty.conf），尚未安裝 kitty。
# install.sh 偵測到 ~/.config/kitty 時會自動 symlink 這份設定 → 裝了 kitty 即生效。
# https://www.nerdfonts.com/font-downloads
# kitty +list-fonts
# font_family         M+ 1mn light Nerd Font Complete Mono
# font_family         Fira Code Light Nerd Font Complete Mono
#
#https://github.com/belluzj/fantasque-sans
font_family         Fantasque Sans Mono Regular

bold_font           auto
italic_font         auto
bold_italic_font    auto
adjust_line_height  100%
adjust_baseline     100%
font_size           14.0

map alt+1 load_config_file
